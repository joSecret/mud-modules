name: Release

# Creează tag-ul vX.Y.Z și release-ul pe GitHub, apoi anunță site-urile să-și actualizeze
# composer.lock. Se pornește din Actions → Release → Run workflow.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versiunea nouă, fără v (ex. 1.0.1)'
        required: true

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verifică versiunea
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Versiune invalidă: $VERSION (formatul e X.Y.Z)"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then echo "Tag-ul v$VERSION există deja"; exit 1; fi
      - name: Tag și release
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
      - name: Anunță site-urile (age, mud-docs, mud-egov)
        env:
          SITES_TOKEN: ${{ secrets.SITES_TOKEN }}
        run: |
          if [ -z "$SITES_TOKEN" ]; then echo "::warning::Lipsește secretul SITES_TOKEN: site-urile nu primesc update automat."; exit 0; fi
          for site in age mud-docs mud-egov; do
            GH_TOKEN="$SITES_TOKEN" gh api "repos/joSecret/$site/dispatches" \
              -f event_type=mud-release \
              -f "client_payload[package]=mud/mud_core" \
              -f "client_payload[version]=$VERSION"
            echo "Anunțat: $site"
          done
